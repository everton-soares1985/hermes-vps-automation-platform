<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sanitized Hermes VPS operational audit</title>
  <desc id="desc">A dark dashboard showing healthy core services, host capacity, scheduler results, and documented exceptions from the September 25, 2026 audit.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".32"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1480" cy="80" r="280" fill="#0e7490" opacity=".08"/>
  <circle cx="120" cy="820" r="250" fill="#7c3aed" opacity=".08"/>
  <rect x="80" y="64" width="1440" height="772" rx="28" fill="#0b1220" stroke="#243244" filter="url(#shadow)"/>
  <rect x="80" y="64" width="1440" height="8" rx="4" fill="url(#accent)"/>
  <text x="128" y="132" fill="#e5e7eb" font-family="Inter,Segoe UI,sans-serif" font-size="38" font-weight="700">Hermes VPS — Operational Audit</text>
  <text x="128" y="170" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="20">Sanitized snapshot · 2026-09-25 · read-only verification</text>

  <g font-family="Inter,Segoe UI,sans-serif">
    <rect x="128" y="212" width="420" height="160" rx="20" fill="#111c2d" stroke="#25364b"/>
    <text x="160" y="256" fill="#94a3b8" font-size="18">HOST CAPACITY</text>
    <text x="160" y="310" fill="#f8fafc" font-size="38" font-weight="700">171 GB free</text>
    <text x="160" y="344" fill="#67e8f9" font-size="18">12% disk used · 6.7 GiB RAM available</text>

    <rect x="590" y="212" width="420" height="160" rx="20" fill="#111c2d" stroke="#25364b"/>
    <text x="622" y="256" fill="#94a3b8" font-size="18">CORE SERVICES</text>
    <text x="622" y="310" fill="#f8fafc" font-size="38" font-weight="700">4 healthy</text>
    <circle cx="634" cy="340" r="7" fill="#22c55e"/><text x="650" y="347" fill="#86efac" font-size="18">Hermes · OmniRoute · Radar · browsers</text>

    <rect x="1052" y="212" width="420" height="160" rx="20" fill="#111c2d" stroke="#25364b"/>
    <text x="1084" y="256" fill="#94a3b8" font-size="18">BUILDER VALIDATION</text>
    <text x="1084" y="310" fill="#f8fafc" font-size="38" font-weight="700">15 / 15 tests</text>
    <text x="1084" y="344" fill="#86efac" font-size="18">Deterministic gates passing</text>

    <text x="128" y="430" fill="#cbd5e1" font-size="24" font-weight="700">30-day scheduler evidence</text>
    <rect x="128" y="458" width="1344" height="232" rx="20" fill="#0f1a2a" stroke="#25364b"/>
    <g fill="#94a3b8" font-size="17">
      <text x="164" y="502">JOB</text><text x="890" y="502">COMPLETED</text><text x="1080" y="502">FAILED</text><text x="1228" y="502">STATUS</text>
    </g>
    <line x1="160" y1="520" x2="1440" y2="520" stroke="#25364b"/>
    <g fill="#e2e8f0" font-size="19">
      <text x="164" y="556">VPS preflight</text><text x="920" y="556">31</text><text x="1108" y="556">0</text><text x="1228" y="556" fill="#86efac">Healthy</text>
      <text x="164" y="598">Daily evidence report</text><text x="920" y="598">30</text><text x="1108" y="598">0</text><text x="1228" y="598" fill="#86efac">Healthy</text>
      <text x="164" y="640">Apply + cleanup workflows</text><text x="920" y="640">61</text><text x="1108" y="640">0</text><text x="1228" y="640" fill="#86efac">Healthy</text>
      <text x="164" y="682">Wellfound Saved</text><text x="920" y="682">2</text><text x="1108" y="682">29</text><text x="1228" y="682" fill="#fbbf24">Semantic mismatch</text>
    </g>

    <rect x="128" y="724" width="1344" height="72" rx="16" fill="#2a2111" stroke="#92400e"/>
    <circle cx="166" cy="760" r="10" fill="#f59e0b"/>
    <text x="192" y="754" fill="#fde68a" font-size="18" font-weight="700">Documented exception</text>
    <text x="192" y="780" fill="#fcd34d" font-size="17">Useful saves can be followed by exit 1 when the eligible candidate set is exhausted.</text>
  </g>
</svg>
